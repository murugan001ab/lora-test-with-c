; PlatformIO project config for ZWELDAQ (Arduino framework, ESP32)
;
; NOTE: I can only write into C:\Users\ADMIN\Desktop\Projects (that's the
; only directory my filesystem access is scoped to right now) -- your
; actual project lives at
; C:\Users\ADMIN\Documents\PlatformIO\Projects\lorawithc.
; Copy the include/ and src/ folders from here into that project (overwrite
; platformio.ini too if you don't already have one set up for esp32dev).

; ----------------------------------------------------------------------
; [env] is PlatformIO's shared base -- every [env:xxx] section below
; inherits these settings (list-valued keys like build_flags/lib_deps get
; APPENDED with each env's own values, not replaced).
; ----------------------------------------------------------------------
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -std=gnu++17
build_unflags =
    -std=gnu++11

lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
    adafruit/Adafruit ADS1X15 @ ^2.5.0
    bblanchon/ArduinoJson @ ^7.2.0

; src/main.cpp is now the real ZWELDAQ firmware, built from the modules
; in src/ (state, time_utils, dwin_display, sensors, radio_sx1262,
; payloads, rfid_handler, shutdown_button). The original monolithic
; zweldaq.cpp and the earlier raw point-to-point LoRa test sketch both
; live under legacy/ for reference -- that directory is outside src/, so
; PlatformIO never compiles it and no build_src_filter exclusion is
; needed here.

; ----------------------------------------------------------------------
; PER-DEVICE ENVIRONMENTS
;
; DEVICE_ID/ORGANIZATION_ID are compiled in via -D build_flags (see
; include/config.h's #ifndef guards), so each physical unit gets its own
; identity from the SAME source tree just by picking which env you
; build/flash with:
;
;   pio run -e device1 -t upload
;   pio run -e device2 -t upload
;
; To add another device, copy one of the blocks below, rename the
; section, and bump DEVICE_ID (and ORGANIZATION_ID if it belongs to a
; different org). No other files need to change.
; ----------------------------------------------------------------------

; LORA_FREQ (Hz, as an unsigned long -- keep the UL suffix) pins each
; device to one of the Kerlink gateway's 8 multiSF channels (all 125 kHz,
; SF 7-12 accepted -- firmware's fixed LORA_SF=7 works on any of them):
;   chan_multiSF_0  865.0625 MHz
;   chan_multiSF_1  865.2325 MHz
;   chan_multiSF_2  865.4025 MHz
;   chan_multiSF_3  865.5725 MHz
;   chan_multiSF_4  865.84   MHz
;   chan_multiSF_5  865.985  MHz
;   chan_multiSF_6  866.13   MHz
;   chan_multiSF_7  866.275  MHz

[env:device1]
build_flags =
    -D DEVICE_ID=1
    -D ORGANIZATION_ID=1
    -D LORA_FREQ=865062500UL

[env:device2]
build_flags =
    -D DEVICE_ID=2
    -D ORGANIZATION_ID=1
    -D LORA_FREQ=865232500UL

[env:device3]
build_flags =
    -D DEVICE_ID=3
    -D ORGANIZATION_ID=1
    -D LORA_FREQ=865402500UL

[env:device4]
build_flags =
    -D DEVICE_ID=4
    -D ORGANIZATION_ID=1
    -D LORA_FREQ=865572500UL

[env:device5]
build_flags =
    -D DEVICE_ID=5
    -D ORGANIZATION_ID=1
    -D LORA_FREQ=865840000UL

[env:device6]
build_flags =
    -D DEVICE_ID=6
    -D ORGANIZATION_ID=1
    -D LORA_FREQ=865985000UL

[env:device7]
build_flags =
    -D DEVICE_ID=7
    -D ORGANIZATION_ID=1
    -D LORA_FREQ=866130000UL

[env:device8]
build_flags =
    -D DEVICE_ID=8
    -D ORGANIZATION_ID=1
    -D LORA_FREQ=866275000UL

